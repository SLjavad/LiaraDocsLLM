services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    container_name: liara-docs-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-liara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-liara}
      POSTGRES_DB: ${POSTGRES_DB:-liara_docs}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-liara} -d ${POSTGRES_DB:-liara_docs}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:8.8-alpine
    container_name: liara-docs-redis
    ports:
      # Host-side port only (container still listens on 6379 internally) —
      # 6379 sometimes falls inside a Windows-reserved dynamic port-exclusion
      # range (netsh interface ipv4 show excludedportrange), which makes
      # Docker Desktop's proxy fail to bind it. Remapped to sidestep that
      # rather than touching Windows networking system-wide.
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
  redis_data:
